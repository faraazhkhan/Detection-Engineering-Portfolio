title: Scheduled Task Created with User-Writable Path or Script Host
id: fc24a135-aea4-4a12-aa6d-63a5a7cabe35
status: experimental
description: Detects schtasks.exe creating a task that runs from a user-writable directory or launches a script host or LOLBin, a common persistence method.
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: Faraaz Khan
date: 2026-11-02
modified: 2026-11-21
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.execution
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    - Image|endswith: '\schtasks.exe'
    - OriginalFileName: 'schtasks.exe'
  selection_create:
    CommandLine|contains:
      - '/create'
      - '-create'
  selection_path:
    CommandLine|contains:
      - '\AppData\'
      - '\Temp\'
      - '\Users\Public\'
      - '\ProgramData\'
      - '\Downloads\'
      - '%TEMP%'
      - '%APPDATA%'
      - '%PUBLIC%'
  selection_lolbin:
    CommandLine|contains:
      - 'powershell'
      - 'pwsh'
      - 'mshta'
      - 'wscript'
      - 'cscript'
      - 'regsvr32'
      - 'rundll32'
      - 'certutil'
      - 'bitsadmin'
  condition: selection_img and selection_create and (selection_path or selection_lolbin)
falsepositives:
  - Software installers and updaters that register tasks from AppData or ProgramData.
  - Admin scripts that schedule PowerShell jobs.
level: medium
