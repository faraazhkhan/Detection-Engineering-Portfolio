title: Microsoft Defender Real-Time Protection Disabled or Exclusions Added via PowerShell
id: 3f6c1a52-9d1e-4b7a-8c21-5a0e7d4b1102
status: experimental
description: Detects PowerShell commands that turn off Microsoft Defender protections (real-time, behavior, script, and download scanning, among others) or add scan exclusions, a common step before running malware.
references:
- https://attack.mitre.org/techniques/T1562/001/
author: Faraaz Khan
date: '2026-11-20'
modified: '2026-11-21'
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_ps:
  - Image|endswith:
    - \powershell.exe
    - \pwsh.exe
    - \powershell_ise.exe
  - OriginalFileName:
    - PowerShell.EXE
    - pwsh.dll
    - PowerShell_ISE.EXE
  selection_set:
    CommandLine|contains: Set-MpPreference
  selection_disable_param:
    CommandLine|contains:
    - DisableRealtimeMonitoring
    - DisableBehaviorMonitoring
    - DisableIOAVProtection
    - DisableScriptScanning
    - DisableIntrusionPreventionSystem
    - DisableBlockAtFirstSeen
  selection_exclusion_cmd:
    CommandLine|contains:
    - Add-MpPreference
    - Set-MpPreference
  selection_exclusion:
    CommandLine|contains: Exclusion
  condition: selection_ps and ((selection_set and selection_disable_param) or (selection_exclusion_cmd and selection_exclusion))
falsepositives:
- IT or security teams adding exclusions for approved software.
- Software installers that add their own Defender exclusions.
level: high
