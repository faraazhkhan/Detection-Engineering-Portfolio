title: Local User Created or Added to Administrators Group via net.exe
id: 3f6c1a52-9d1e-4b7a-8c21-5a0e7d4b1103
status: experimental
description: Detects net.exe commands that create a local account or add one to the local Administrators group, a simple way for attackers to keep access to a host.
references:
- https://attack.mitre.org/techniques/T1136/001/
- https://attack.mitre.org/techniques/T1098/
author: Faraaz Khan
date: '2026-11-20'
modified: '2026-11-21'
tags:
- attack.persistence
- attack.t1136.001
- attack.privilege-escalation
- attack.t1098
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - \net.exe
    - \net1.exe
  - OriginalFileName:
    - net.exe
    - net1.exe
  selection_group:
    CommandLine|contains|all:
    - localgroup
    - /add
  selection_admin_name:
    CommandLine|contains:
    - administrators
    - administrateurs
    - administratoren
    - administradores
  selection_user:
    CommandLine|contains|all:
    - ' user '
    - /add
  condition: selection_img and ((selection_group and selection_admin_name) or selection_user)
falsepositives:
- Help desk or imaging scripts that create local accounts.
- Software installers that create service accounts.
level: medium
