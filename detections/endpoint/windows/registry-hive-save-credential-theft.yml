title: Registry Hive Export of SAM, SYSTEM or SECURITY via reg.exe
id: 3f6c1a52-9d1e-4b7a-8c21-5a0e7d4b1110
status: experimental
description: Detects reg.exe saving the SAM, SYSTEM or SECURITY registry hives to a file, a step attackers use to extract local password hashes offline.
references:
- https://attack.mitre.org/techniques/T1003/002/
author: Faraaz Khan
date: '2026-11-20'
modified: '2026-11-21'
tags:
- attack.credential-access
- attack.t1003.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \reg.exe
  - OriginalFileName: reg.exe
  selection_save:
    CommandLine|contains: ' save '
  selection_export:
    CommandLine|contains: ' export '
  selection_hive:
    CommandLine|contains:
    - hklm\sam
    - hklm\system
    - hklm\security
    - hkey_local_machine\sam
    - hkey_local_machine\system
    - hkey_local_machine\security
  selection_hive_exact:
    CommandLine|re: '(?i)(hklm|hkey_local_machine)\\(sam|security|system)(["\s]|$)'
  condition: selection_img and ((selection_save and selection_hive) or (selection_export and selection_hive_exact))
falsepositives:
- Backup or imaging tools that export registry hives.
- Administrators exporting a whole hive for troubleshooting. A sub-key export such as `HKLM\SYSTEM\CurrentControlSet\...` does not match the `export` branch.
level: high
