title: Office Application Spawning Encoded PowerShell
id: ed949df2-50c2-4dd5-ba40-da628587769d
status: experimental
description: Detects a Microsoft Office application launching PowerShell with an encoded command, a common pattern after a malicious document is opened.
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1204/002/
author: Faraaz Khan
date: 2026-11-02
tags:
  - attack.execution
  - attack.t1059.001
  - attack.t1204.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\powerpnt.exe'
      - '\outlook.exe'
  selection_child:
    - Image|endswith:
        - '\powershell.exe'
        - '\pwsh.exe'
    - OriginalFileName:
        - 'PowerShell.EXE'
        - 'pwsh.dll'
  selection_encoded:
    CommandLine|contains:
      - ' -enc'
      - ' -EncodedCommand'
      - ' -ec '
  condition: selection_parent and selection_child and selection_encoded
falsepositives:
  - Legacy macros or add-ins in some enterprise workflows that call encoded PowerShell.
level: high
