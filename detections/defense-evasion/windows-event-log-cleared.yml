title: Windows Event Log Cleared via wevtutil or PowerShell
id: 50010e82-7e4d-4414-8ddc-8aa92f8cb918
status: experimental
description: Detects attempts to clear Windows event logs using wevtutil or the Clear-EventLog cmdlet, a common anti-forensics step.
references:
  - https://attack.mitre.org/techniques/T1070/001/
author: Faraaz Khan
date: 2026-11-02
tags:
  - attack.defense-evasion
  - attack.t1070.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_wevtutil:
    Image|endswith: '\wevtutil.exe'
    CommandLine|contains:
      - ' cl '
      - ' clear-log '
  selection_powershell:
    CommandLine|contains: 'Clear-EventLog'
  condition: 1 of selection_*
falsepositives:
  - System administrators clearing logs during maintenance or after imaging.
  - Build or lab environments that reset logs automatically.
level: high
